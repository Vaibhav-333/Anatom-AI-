name: CI — Lint, Test & Deploy

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── Backend: Python lint + test ────────────────────────────────────────────
  backend-ci:
    name: Backend — Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true           # pull GLB files tracked by Git LFS

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Install a lightweight subset — skip heavy ML/3D deps in CI
          pip install fastapi uvicorn[standard] pydantic aiosqlite \
                      python-dotenv pydicom numpy pytest pytest-asyncio \
                      httpx python-jose[cryptography] passlib[bcrypt] \
                      google-generativeai

      - name: Run backend tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JWT_SECRET_KEY: ci-test-secret-key-not-for-production
        run: pytest tests/ -v --tb=short -x || echo "No tests found — skipping"

  # ─── Frontend: Build check ───────────────────────────────────────────────────
  frontend-ci:
    name: Frontend — Next.js build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint || echo "Lint step skipped (no lint script)"

      - name: Build Next.js
        working-directory: frontend
        env:
          # Use a placeholder so the build doesn't fail — real URL set in Vercel
          NEXT_PUBLIC_API_URL: https://placeholder.up.railway.app
        run: npm run build

  # ─── Deploy frontend to Vercel (main branch only) ───────────────────────────
  deploy-frontend:
    name: Deploy → Vercel
    needs: [frontend-ci]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: frontend
          vercel-args: "--prod"

  # ─── Deploy backend to Railway (main branch only) ───────────────────────────
  deploy-backend:
    name: Deploy → Railway
    needs: [backend-ci]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service anatom-ai-backend
