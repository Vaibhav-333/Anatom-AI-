[build]
# Railway uses nixpacks by default — this tells it to use Python.
builder = "nixpacks"

[deploy]
# Start the FastAPI server via Uvicorn with 2 workers.
# $PORT is injected by Railway at runtime.
startCommand = "uvicorn src.serving.api:app --host 0.0.0.0 --port $PORT --workers 2"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
