[build]
# Use our Dockerfile so system libs (libgl1 for OpenCV) are included.
builder = "dockerfile"

[deploy]
# Start the FastAPI server via Uvicorn with 2 workers.
# $PORT is injected by Railway at runtime.
startCommand = "uvicorn src.serving.api:app --host 0.0.0.0 --port $PORT --workers 2"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
