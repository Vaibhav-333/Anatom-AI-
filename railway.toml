[build]
# Use our Dockerfile so system libs (libgl1 for OpenCV) are included.
builder = "dockerfile"

[deploy]
# sh -c is required so $PORT (injected by Railway) gets shell-expanded.
startCommand = "sh -c 'uvicorn src.serving.api:app --host 0.0.0.0 --port $PORT --workers 1'"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
